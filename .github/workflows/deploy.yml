name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    # Forks have no deployment secrets — skip instead of failing on every push.
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
    env:
      # wrangler.ci.jsonc in the repo holds every structural field except the worker name and
      # KV namespace id, which come from small repository secrets. Vars are never part of this —
      # they're only ever set by `bun run deploy:prod` from your local wrangler.prod.jsonc, and
      # `keep_vars` in wrangler.ci.jsonc keeps CI from touching them.
      HAS_DEPLOY_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CF_WORKER_NAME != '' && secrets.CF_KV_NAMESPACE_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate worker types
        run: |
          cp -n .dev.vars.example .dev.vars
          bun run types

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Prepare CI wrangler config
        if: env.HAS_DEPLOY_SECRETS == 'true'
        # The .dev.vars written above holds empty placeholders and exists only for typing.
        # Deploy never reads it, but it has no business being around during one either.
        run: |
          rm -f .dev.vars
          sed -e "s#__WORKER_NAME__#${CF_WORKER_NAME}#" \
              -e "s#__KV_NAMESPACE_ID__#${CF_KV_NAMESPACE_ID}#" \
              wrangler.ci.jsonc > wrangler.prod.jsonc
        env:
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      - name: Deploy
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          command: deploy -c wrangler.prod.jsonc
        env:
          # Not committed to wrangler.jsonc; required when the token can see several accounts
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skipped
        if: env.HAS_DEPLOY_SECRETS != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CF_WORKER_NAME / CF_KV_NAMESPACE_ID not set — deployment skipped."
