name: CI

# Gates pull requests only. Pushes to main are covered by deploy.yml, which runs the
# same generate-types/typecheck/test steps before deploying — a push-to-main trigger
# here would just duplicate that in parallel for no benefit.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Typecheck and test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # worker-configuration.d.ts is generated, not committed. `wrangler types` gets var
      # names and types from wrangler.jsonc's "vars", and secret names from its
      # "secrets": { "required": [...] } — no .dev.vars file needed just to typecheck.
      - name: Generate worker types
        run: bun run types

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test
