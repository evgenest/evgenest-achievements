name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Typecheck and test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # worker-configuration.d.ts is generated, not committed. `wrangler types` reads the
      # var names from wrangler.jsonc and the secret names from .dev.vars — the example
      # file carries the same keys with empty values, which is all typing needs.
      - name: Generate worker types
        run: |
          cp -n .dev.vars.example .dev.vars
          bun run types

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test
